services:
  db:
    image: postgres:16
    container_name: bookstock_db
    restart: always
    environment:
      POSTGRES_DB: bookstock
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./Backend
    container_name: bookstock_backend
    restart: always
    depends_on:
      - db
    env_file:
      - ./Backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:1504@host.docker.internal:5432/BookStock
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app

  frontend:
    build:
      context: ./Frontend
    container_name: bookstock_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data: